<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>内容驱动滚动叙事</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="ghost-nav" id="ghostNav" data-template="navigation" aria-label="章节导航">
      <div class="nav-title" data-story="nav-title"></div>
      <ul class="nav-chapters" data-story="chapters"></ul>
      <div class="chapter-progress" data-story="progress" role="group" aria-label="阅读进度">
        <span class="chapter-progress__steps" data-story="progress-steps"></span>
        <progress class="chapter-progress__bar" max="100" value="0" data-story="progress-bar"></progress>
        <span data-story="progress-label"></span>
      </div>
    </nav>

    <main class="article-content">
      <section class="scrolly" id="scrolly" aria-label="滚动叙事章节">
        <figure class="scrolly__bg" id="scrollyBg">
          <div data-story="scenes"></div>
          <canvas class="snow-canvas" id="snowCanvas" aria-hidden="true"></canvas>
          <div class="cover-text" id="coverText">
            <h1 id="coverTitle">故事标题</h1>
            <p class="subtitle" data-story="subtitle"></p>
            <div class="byline" data-story="byline"></div>
          </div>
          <figcaption class="bg-scene__caption is-hidden" id="bgCaption"></figcaption>
        </figure>
        <div class="scrolly__steps" data-story="steps"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>版权所有 © 虚拟新闻周刊。排版致敬 The New York Times 《Snow Fall》。</p>
    </footer>

    <script src="js/story-config.js" defer></script>
    <script src="js/scrollama.min.js" defer></script>
    <script src="js/app.js" data-config-src="" defer></script>
  </body>
</html>
